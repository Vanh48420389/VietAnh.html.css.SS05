<body>
    <div class="container">
        <h1>Center Align Text</h1>
        <p>To just center the text inside an element, use <span id="text-align">text-align: center;</span></p>
        <div class="center">
            This text is centered.
        </div>
        <div class="example">
            <h3>Example</h3>
            <div class="code-block">
                <div class="code">
                    <p id="center2">.center {</p><br>
                    <p id="text-align2">text-align : <span id="center3">center</span>;</p><br>
                    <p id="border">border: <span id="solid"> 3px solid green</span><span>;</span></p><br>
                    }
                </div>
            </div>
            <button>Try it Yourself »</button>
        </div>
    </div>
</body>
